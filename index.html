<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBM | Blotan Base Management</title>
<style>
:root{--walnut:#5B3A29;--oak:#D6B98C;--cream:#F5F0E6;--sage:#78816B;--charcoal:#292824;--white:#FFFFFF;--caramel:#A47752;--sand:#E8DFD1;--mocha:#806044;--muted:#81796e;--line:#e5dbcd;--danger:#a74737;--success:#527052}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--charcoal);font:14px/1.5 "Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:9px 13px;background:var(--walnut);color:white;font-weight:600}button:hover{filter:brightness(1.1)}button.alt{background:var(--sand);color:var(--walnut)}button.danger{background:#f7e8e3;color:var(--danger)}button.sm{padding:5px 9px;font-size:12px}
.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--walnut);color:var(--cream);padding:22px 15px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 19px;border-bottom:1px solid #ffffff2b}.logo{width:40px;height:40px;border-radius:11px;background:var(--oak);color:var(--walnut);display:grid;place-items:center;font-weight:900;font-size:17px}.brand b{display:block;font-size:15px}.brand small{color:#e2d2bd}.section{font-size:10px;letter-spacing:1.5px;color:#d6b98c;padding:0 10px}.nav{display:grid;gap:4px}.nav button{background:transparent;color:#f5f0e6;text-align:left;font-weight:500;padding:11px 12px}.nav button.active,.nav button:hover{background:#ffffff1d}.nav span{display:inline-block;width:27px;color:var(--oak)}.sidefoot{margin-top:auto;color:#d6c7b6;font-size:11px;padding:10px}
main{min-width:0}.top{height:70px;background:var(--white);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px}.top h1{font-size:18px;margin:0;color:var(--walnut)}.top small{color:var(--muted)}.user{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--sand);color:var(--walnut);font-weight:800}.content{max-width:1500px;margin:auto;padding:25px 28px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:19px}.head h2{margin:0 0 4px;color:var(--walnut);font-size:22px}.head p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 3px 12px #5b3a2909}.statlabel{font-size:12px;color:var(--muted)}.statval{font-size:28px;font-weight:800;color:var(--walnut);margin:5px 0}.statnote{font-size:11px;color:var(--muted)}.two{grid-template-columns:1.3fr 1fr}.card h3{font-size:15px;margin:0 0 13px;color:var(--walnut)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--mocha);background:#faf7f1}th,td{padding:11px 10px;border-bottom:1px solid var(--line)}td{font-size:12px}tbody tr:last-child td{border:0}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:700;background:var(--sand);color:var(--mocha)}.pill.green{background:#e8efe4;color:#496345}.pill.amber{background:#f7edda;color:#91642d}.pill.red{background:#f7e8e3;color:var(--danger)}.progress{height:7px;background:#eee7dc;border-radius:20px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:var(--sage)}.schedule{display:grid;gap:9px}.scheduleitem{display:grid;grid-template-columns:100px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:10px}.date{background:var(--cream);color:var(--walnut);text-align:center;border-radius:7px;padding:7px;font-weight:800}.date small{display:block;color:var(--muted);font-weight:500}.alert{padding:10px 12px;border-radius:8px;background:#f7edda;color:#765323;margin:8px 0;font-size:12px}.alert.red{background:#f7e8e3;color:var(--danger)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--mocha)}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fffdfa;color:var(--charcoal);width:100%}.field textarea{min-height:70px}.modalbg{position:fixed;inset:0;background:#29282488;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalbg.show{display:flex}.modal{width:min(630px,100%);max-height:90vh;overflow:auto;background:white;border-radius:13px;padding:22px}.modalhead,.modalfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead{margin-bottom:16px}.modalhead h3{margin:0;color:var(--walnut)}.modalfoot{justify-content:flex-end;margin-top:18px}.close{background:transparent;color:var(--walnut);font-size:23px;padding:0}.empty{text-align:center;padding:25px;color:var(--muted)}.note{font-size:11px;color:var(--muted);margin-top:13px}.toast{position:fixed;right:20px;bottom:20px;background:var(--charcoal);color:white;border-radius:9px;padding:12px 16px;display:none;z-index:30}.toast.show{display:block}
@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.brand{padding-bottom:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.section,.sidefoot{display:none}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.content{padding:18px}.top{padding:0 18px}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.head{flex-direction:column}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.scheduleitem{grid-template-columns:75px 1fr}.scheduleitem>.pill{grid-column:2}}
</style></head>
<body>
<div class="layout">
<aside class="sidebar">
 <div class="brand"><div class="logo">BB</div><div><b>Blotan Base</b><small>Management System</small></div></div>
 <div class="section">MENU UTAMA</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span>▦</span>Dashboard</button>
  <button data-page="orders"><span>▤</span>Pesanan</button>
  <button data-page="schedule"><span>◷</span>Penjadwalan Produksi</button>
  <button data-page="procurement"><span>⇄</span>Pengadaan</button>
  <button data-page="inventory"><span>▣</span>Persediaan</button>
  <button data-page="tracking"><span>⌁</span>Material Tracking</button>
  <button data-page="monitoring"><span>◫</span>Monitoring Produksi</button>
  <button data-page="reports"><span>▥</span>Laporan & Evaluasi</button>
 </nav>
 <div class="sidefoot">Prototype demonstrasi BBM<br>Palet Walnut · v1.0</div>
</aside>
<main><header class="top"><div><h1 id="topTitle">Dashboard</h1><small>Operational Management & Performance Monitoring</small></div><div class="user"><div class="avatar">AD</div><div><b>Admin BBM</b><br><small class="muted">Petugas operasional</small></div></div></header><section class="content" id="view"></section></main>
</div>
<div class="modalbg" id="modal"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Tambah data</h3><button class="close" onclick="closeModal()">×</button></div><form id="form"><div class="formgrid" id="fields"></div><div class="modalfoot"><button type="button" class="alt" onclick="closeModal()">Batal</button><button type="submit">Simpan Data</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const demo={
orders:[
{id:"ORD-001",customer:"PT Aruna Living",product:"Meja makan custom",qty:12,orderDate:"2026-11-02",due:"2026-11-22",status:"Dalam proses",spec:"Jati daur ulang, finishing natural"},
{id:"ORD-002",customer:"Studio Rumah",product:"Kursi lounge",qty:8,orderDate:"2026-11-03",due:"2026-11-28",status:"Menunggu jadwal",spec:"Ukuran khusus, kain beige"},
{id:"ORD-003",customer:"Bali Home",product:"Rak display",qty:5,orderDate:"2026-10-29",due:"2026-11-18",status:"Dalam proses",spec:"Jati daur ulang"}],
schedules:[
{id:"SCH-001",orderId:"ORD-001",activity:"Pemotongan material",start:"2026-11-06",end:"2026-11-08",owner:"Tim Produksi A",status:"Berjalan",progress:65},
{id:"SCH-002",orderId:"ORD-001",activity:"Perakitan",start:"2026-11-09",end:"2026-11-13",owner:"Tim Produksi B",status:"Terjadwal",progress:0},
{id:"SCH-003",orderId:"ORD-003",activity:"Finishing",start:"2026-11-05",end:"2026-11-09",owner:"Tim Finishing",status:"Terlambat",progress:40}],
procurement:[
{id:"PO-001",supplier:"UD Kayu Makmur",material:"Kayu jati daur ulang",qty:2,unit:"m³",orderDate:"2026-11-01",eta:"2026-11-07",actual:"",status:"Dipesan"},
{id:"PO-002",supplier:"CV Finishing Jaya",material:"Wood coating natural",qty:20,unit:"liter",orderDate:"2026-11-02",eta:"2026-11-05",actual:"",status:"Menunggu"}],
inventory:[
{id:"MAT-001",name:"Kayu jati daur ulang",stock:4,min:2,unit:"m³"},
{id:"MAT-002",name:"Wood coating natural",stock:8,min:10,unit:"liter"},
{id:"MAT-003",name:"Sekrup 5 cm",stock:350,min:100,unit:"pcs"},
{id:"MAT-004",name:"Amplas",stock:45,min:30,unit:"lembar"}],
tracking:[
{id:"TRK-001",material:"Kayu jati daur ulang",activity:"Dipesan dari pemasok",date:"2026-11-01",qty:"2 m³",status:"Dalam pengiriman"},
{id:"TRK-002",material:"Wood coating natural",activity:"Pemeriksaan penerimaan",date:"2026-11-03",qty:"20 liter",status:"Menunggu"}],
monitoring:[
{id:"MON-001",orderId:"ORD-001",activity:"Pemotongan material",plan:"2026-11-08",actual:"",progress:65,status:"Berjalan"},
{id:"MON-002",orderId:"ORD-003",activity:"Finishing",plan:"2026-11-04",actual:"",progress:40,status:"Terlambat"}]};
let db=load();function load(){try{return JSON.parse(localStorage.getItem("bbm_walnut_db"))||structuredClone(demo)}catch(e){return JSON.parse(JSON.stringify(demo))}}
function save(){localStorage.setItem("bbm_walnut_db",JSON.stringify(db))}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(x){return x?new Date(x+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"-"}
function pill(s){let c=/terlambat|minimum/i.test(s)?"red":/berjalan|dipesan|proses|pengiriman/i.test(s)?"amber":/selesai|diterima|aman/i.test(s)?"green":"";return `<span class="pill ${c}">${esc(s)}</span>`}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function table(h,rows){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${h.length}" class="empty">Belum ada data.</td></tr>`}</tbody></table></div>`}
function stat(l,n,d){return `<div class="card"><div class="statlabel">${l}</div><div class="statval">${n}</div><div class="statnote">${d}</div></div>`}
function btn(label,fn,cls=""){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
let current="dashboard";
const titles={dashboard:"Dashboard",orders:"Order Management",schedule:"Production Planning & Scheduling",procurement:"Procurement & Supplier Management",inventory:"Inventory Management",tracking:"Material Tracking",monitoring:"Production Monitoring",reports:"Dashboard & Performance Evaluation"};
document.getElementById("nav").onclick=e=>{let b=e.target.closest("[data-page]");if(b)go(b.dataset.page)};
function go(p){current=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("topTitle").textContent=titles[p];render()}
function render(){let v=document.getElementById("view");
if(current==="dashboard"){
let late=db.schedules.filter(x=>x.status==="Terlambat").length,low=db.inventory.filter(x=>x.stock<x.min).length;
v.innerHTML=`<div class="head"><div><h2>Ringkasan Operasional</h2><p>Pantau pesanan, jadwal produksi, pengadaan, dan persediaan perusahaan.</p></div><div class="actions">${btn("Reset Data Demo","resetDemo()","alt")}${btn("+ Jadwal Produksi","go('schedule')")}</div></div>
<div class="grid stats">${stat("Total Pesanan",db.orders.length,"Pesanan terdaftar")}${stat("Aktivitas Produksi",db.schedules.length,"Jadwal tercatat")}${stat("Jadwal Terlambat",late,"Perlu tindak lanjut")}${stat("Stok di Bawah Minimum",low,"Perlu pengadaan")}</div>
<div class="grid two"><div class="card"><h3>Jadwal Produksi Terdekat</h3><div class="schedule">${db.schedules.slice().sort((a,b)=>a.start.localeCompare(b.start)).slice(0,5).map(s=>`<div class="scheduleitem"><div class="date">${date(s.start)}<small>Mulai</small></div><div><b>${esc(s.activity)}</b><div class="muted">${esc(s.orderId)} · ${esc(s.owner)}</div><div class="progress"><i style="width:${s.progress}%"></i></div></div>${pill(s.status)}</div>`).join("")||'<div class="empty">Belum ada jadwal.</div>'}</div></div>
<div class="card"><h3>Peringatan Operasional</h3>${db.inventory.filter(x=>x.stock<x.min).map(x=>`<div class="alert">Stok <b>${esc(x.name)}</b> di bawah minimum (${x.stock} ${esc(x.unit)} / min ${x.min}).</div>`).join("")}${db.schedules.filter(x=>x.status==="Terlambat").map(x=>`<div class="alert red">Aktivitas <b>${esc(x.activity)}</b> pada ${esc(x.orderId)} terlambat.</div>`).join("")}${!low&&!late?'<div class="alert">Tidak ada peringatan dari data demo.</div>':""}<p class="note">Peringatan dihitung otomatis dari status jadwal dan batas minimum stok.</p></div></div>
<div class="card" style="margin-top:15px"><h3>Pesanan Terbaru</h3>${table(["ID","Konsumen","Produk","Target Selesai","Status"],db.orders.map(o=>`<tr><td><b>${esc(o.id)}</b></td><td>${esc(o.customer)}</td><td>${esc(o.product)}</td><td>${date(o.due)}</td><td>${pill(o.status)}</td></tr>`).join(""))}</div>`;
}else if(current==="orders")pageTable("Order Management","Data identitas pesanan, spesifikasi produk, kuantitas, dan target penyelesaian.","orders",["ID Pesanan","Konsumen","Produk","Jumlah","Tgl Pesan","Target","Status"],o=>`<td><b>${esc(o.id)}</b></td><td>${esc(o.customer)}</td><td>${esc(o.product)}<div class="muted">${esc(o.spec)}</div></td><td>${o.qty}</td><td>${date(o.orderDate)}</td><td>${date(o.due)}</td><td>${pill(o.status)}</td>`);
else if(current==="schedule")pageTable("Penjadwalan Produksi","Atur tahapan pekerjaan, tanggal mulai/selesai, penanggung jawab, dan progres.","schedules",["ID","Pesanan","Aktivitas","Mulai","Selesai","Penanggung Jawab","Progres","Status"],s=>`<td><b>${esc(s.id)}</b></td><td>${esc(s.orderId)}</td><td>${esc(s.activity)}</td><td>${date(s.start)}</td><td>${date(s.end)}</td><td>${esc(s.owner)}</td><td>${s.progress}%<div class="progress"><i style="width:${s.progress}%"></i></div></td><td>${pill(s.status)}</td>`);
else if(current==="procurement")pageTable("Pengadaan & Pemasok","Catat purchase order, estimasi kedatangan, dan penerimaan aktual.","procurement",["ID PO","Pemasok","Material","Jumlah","Tgl Pesan","Estimasi","Aktual","Status"],p=>`<td><b>${esc(p.id)}</b></td><td>${esc(p.supplier)}</td><td>${esc(p.material)}</td><td>${p.qty} ${esc(p.unit)}</td><td>${date(p.orderDate)}</td><td>${date(p.eta)}</td><td>${date(p.actual)}</td><td>${pill(p.status)}</td>`);
else if(current==="inventory")pageTable("Persediaan Material","Pantau stok tersedia, batas minimum, dan kebutuhan pengadaan.","inventory",["Kode","Material","Stok","Minimum","Satuan","Kondisi"],i=>`<td><b>${esc(i.id)}</b></td><td>${esc(i.name)}</td><td>${i.stock}</td><td>${i.min}</td><td>${esc(i.unit)}</td><td>${i.stock<i.min?pill("Di bawah minimum"):pill("Aman")}</td>`);
else if(current==="tracking")pageTable("Material Tracking","Telusuri perjalanan material dari pemesanan hingga penggunaan produksi.","tracking",["ID","Material","Aktivitas","Tanggal","Jumlah","Status"],t=>`<td><b>${esc(t.id)}</b></td><td>${esc(t.material)}</td><td>${esc(t.activity)}</td><td>${date(t.date)}</td><td>${esc(t.qty)}</td><td>${pill(t.status)}</td>`);
else if(current==="monitoring")pageTable("Monitoring Produksi","Bandingkan target dengan realisasi dan catat progres aktual pekerjaan.","monitoring",["ID","Pesanan","Aktivitas","Target","Realisasi","Progres","Status"],m=>`<td><b>${esc(m.id)}</b></td><td>${esc(m.orderId)}</td><td>${esc(m.activity)}</td><td>${date(m.plan)}</td><td>${date(m.actual)}</td><td>${m.progress}%<div class="progress"><i style="width:${m.progress}%"></i></div></td><td>${pill(m.status)}</td>`);
else if(current==="reports"){let n=db.schedules.length,late=db.schedules.filter(x=>x.status==="Terlambat").length,done=db.schedules.filter(x=>x.status==="Selesai").length;
v.innerHTML=`<div class="head"><div><h2>Laporan & Evaluasi Kinerja</h2><p>Ringkasan untuk evaluasi pesanan, produksi, pengadaan, dan persediaan.</p></div><button class="alt" onclick="window.print()">Cetak Laporan</button></div><div class="grid stats">${stat("Total Jadwal",n,"Aktivitas tercatat")}${stat("Selesai",done,"Aktivitas selesai")}${stat("Terlambat",late,"Perlu evaluasi")}${stat("Total PO",db.procurement.length,"Pengadaan tercatat")}</div><div class="grid two"><div class="card"><h3>Status Jadwal Produksi</h3>${["Terjadwal","Berjalan","Selesai","Terlambat"].map(s=>{let c=db.schedules.filter(x=>x.status===s).length;return `<p>${s} <b style="float:right">${c}</b></p><div class="progress"><i style="width:${n?c/n*100:0}%"></i></div>`}).join("")}</div><div class="card"><h3>Evaluasi Persediaan</h3>${db.inventory.map(i=>`<p>${esc(i.name)} <b style="float:right">${i.stock} ${esc(i.unit)}</b></p><div class="progress"><i style="width:${Math.min(100,i.stock/Math.max(i.min,1)*50)}%"></i></div>`).join("")}</div></div><p class="note">Laporan dihitung dari data pada browser ini. Data demo bukan data aktual perusahaan.</p>`}
}
function pageTable(title,desc,type,headers,renderRow){let rows=db[type].map(x=>`<tr>${renderRow(x)}<td>${btn("Edit",`editRow('${type}','${x.id}')`,"alt sm")} ${btn("Hapus",`delRow('${type}','${x.id}')`,"danger sm")}</td></tr>`).join("");
document.getElementById("view").innerHTML=`<div class="head"><div><h2>${title}</h2><p>${desc}</p></div><button onclick="openForm('${type}')">+ Tambah Data</button></div><div class="card">${table([...headers,"Aksi"],rows)}</div>`}
const schema={
orders:[["id","ID Pesanan","text"],["customer","Nama Konsumen","text"],["product","Nama Produk","text"],["qty","Kuantitas","number"],["orderDate","Tanggal Pesan","date"],["due","Target Selesai","date"],["status","Status","select","Menunggu jadwal|Dalam proses|Selesai|Dibatalkan"],["spec","Spesifikasi","textarea"]],
schedules:[["id","ID Jadwal","text"],["orderId","ID Pesanan","text"],["activity","Tahapan Produksi","text"],["start","Tanggal Mulai","date"],["end","Target Selesai","date"],["owner","Penanggung Jawab","text"],["progress","Progres (%)","number"],["status","Status","select","Terjadwal|Berjalan|Selesai|Terlambat"]],
procurement:[["id","ID PO","text"],["supplier","Nama Pemasok","text"],["material","Nama Material","text"],["qty","Jumlah","number"],["unit","Satuan","text"],["orderDate","Tanggal Pesan","date"],["eta","Estimasi Tiba","date"],["actual","Tanggal Aktual Tiba","date"],["status","Status","select","Menunggu|Dipesan|Dalam pengiriman|Diterima|Terlambat"]],
inventory:[["id","Kode Material","text"],["name","Nama Material","text"],["stock","Stok Tersedia","number"],["min","Batas Minimum","number"],["unit","Satuan","text"]],
tracking:[["id","ID Tracking","text"],["material","Nama Material","text"],["activity","Aktivitas Material","text"],["date","Tanggal","date"],["qty","Jumlah","text"],["status","Status","select","Dipesan|Dalam pengiriman|Diterima|Diperiksa|Disimpan|Digunakan produksi"]],
monitoring:[["id","ID Monitoring","text"],["orderId","ID Pesanan","text"],["activity","Aktivitas Produksi","text"],["plan","Target Selesai","date"],["actual","Tanggal Realisasi","date"],["progress","Progres (%)","number"],["status","Status","select","Terjadwal|Berjalan|Selesai|Terlambat"]]};
let typeNow="",idNow=null;
function openForm(type,row=null){typeNow=type;idNow=row?.id||null;document.getElementById("modalTitle").textContent=(row?"Edit ":"Tambah ")+titles[type];
document.getElementById("fields").innerHTML=schema[type].map(f=>{let [k,l,t,opts]=f,val=row?.[k]??(t==="number"?0:"");let el=t==="select"?`<select name="${k}">${opts.split("|").map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select>`:t==="textarea"?`<textarea name="${k}">${esc(val)}</textarea>`:`<input name="${k}" type="${t}" value="${esc(val)}" ${t==="number"?'min="0"':''} required>`;return `<div class="field ${t==="textarea"?"full":""}"><label>${l}</label>${el}</div>`}).join("");document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function editRow(type,id){let x=db[type].find(r=>r.id===id);if(x)openForm(type,x)}
function delRow(type,id){if(confirm("Hapus data "+id+"?")){db[type]=db[type].filter(x=>x.id!==id);save();render();toast("Data dihapus.")}}
document.getElementById("form").onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());schema[typeNow].forEach(f=>{if(f[2]==="number")d[f[0]]=Number(d[f[0]])});if(idNow){let i=db[typeNow].findIndex(x=>x.id===idNow);db[typeNow][i]=d;toast("Data diperbarui.")}else{if(db[typeNow].some(x=>x.id===d.id)){toast("ID sudah digunakan.");return}db[typeNow].push(d);toast("Data ditambahkan.")}save();closeModal();render()};
